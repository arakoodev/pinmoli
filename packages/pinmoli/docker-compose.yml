services:
  pinmoli:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.pinmoli:/root/.pinmoli
    env_file:
      - ../../.env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    stdin_open: true
    tty: true
    command: npm run dev
